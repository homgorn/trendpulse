[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trendpulse"
version = "0.2.0"
description = "AI-Driven Market Intelligence & Content Generation Platform for Gaming"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "fastapi[standard]>=0.135.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "typer>=0.12.3",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-client>=0.20",
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "locust>=2.25",
    "bandit>=1.8",
]

[project.scripts]
trendpulse = "trendpulse.cli:app"

[tool.uv]
dev-dependencies = ["pytest", "pytest-asyncio", "ruff", "locust", "bandit"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ASYNC"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
