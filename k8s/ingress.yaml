apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trendpulse-api-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "30"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  tls:
    - hosts:
        - api.trendpulse.com
      secretName: trendpulse-tls
  rules:
    - host: api.trendpulse.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: trendpulse-api
                port:
                  number: 80
